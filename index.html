<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Dashboard</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #18181b);
      --card-bg: var(--tg-theme-secondary-bg-color, #27272a);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #a1a1aa);
      --button-color: var(--tg-theme-button-color, #9146ff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      bottom: 0;
      right: -4px;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
    }

    .badge.online {
      background-color: #eb0400;
    }

    .badge.offline {
      background-color: #53535f;
    }

    .channel-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .info-text {
      font-size: 12px;
      color: var(--hint-color);
      margin-bottom: 2px;
    }

    .uptime {
      font-size: 11px;
      color: #00e676;
      font-weight: 600;
      margin-bottom: 10px;
      height: 15px;
    }

    .btn-link {
      margin-top: auto;
      width: 100%;
      padding: 8px 0;
      background-color: var(--button-color);
      color: var(--button-text);
      text-decoration: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      display: inline-block;
    }

    .btn-link:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>Отслеживаемые каналы</h1>
  <div class="grid" id="channels-container"></div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем окно на всю высоту

    // Моковые данные для первого теста интерфейса
    // (Позже заменим на реальный запрос к боту)
    const mockChannels = [
      {
        name: "stefakku",
        avatar: "https://via.placeholder.com/64",
        followers: "1,234",
        isOnline: true,
        uptime: "2 ч. 15 мин.",
        url: "https://twitch.tv/stefakku"
      },
      {
        name: "shroud",
        avatar: "https://via.placeholder.com/64",
        followers: "10.9M",
        isOnline: false,
        uptime: "",
        url: "https://twitch.tv/shroud"
      }
    ];

    function renderChannels(channels) {
      const container = document.getElementById("channels-container");
      container.innerHTML = "";

      channels.forEach(ch => {
        const card = document.createElement("div");
        card.className = "card";

        const badgeClass = ch.isOnline ? "online" : "offline";
        const badgeText = ch.isOnline ? "Live" : "Off";
        const uptimeText = ch.isOnline ? `⏱ ${ch.uptime}` : "";

        card.innerHTML = `
          <div class="avatar-wrapper">
            <img class="avatar" src="${ch.avatar}" alt="${ch.name}">
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="channel-name">${ch.name}</div>
          <div class="info-text">👥 ${ch.followers} фолловеров</div>
          <div class="uptime">${uptimeText}</div>
          <a class="btn-link" href="${ch.url}" target="_blank">Перейти на канал</a>
        `;

        container.appendChild(card);
      });
    }

    // Рендерим тестовые карточки при загрузке
    renderChannels(mockChannels);
  </script>
</body>
</html>
