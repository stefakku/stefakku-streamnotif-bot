<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд — WIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f0f13);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8a8a93);
            --accent-color: #6441a5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            box-sizing: border-box;
        }

        .container {
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-wrapper {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(100, 65, 165, 0.1);
            border: 2px solid rgba(100, 65, 165, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-wrapper svg {
            width: 60px;
            height: 60px;
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0 0 12px 0;
        }

        p {
            font-size: 14px;
            color: var(--hint-color);
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            width: 45%;
            height: 100%;
            background: var(--accent-color);
            border-radius: 4px;
        }

        .progress-text {
            font-size: 12px;
            color: var(--hint-color);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.7-3.7a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0l-3.7 3.7z"></path>
                <path d="M11 12l-2 2"></path>
                <path d="M8 15l-3 3"></path>
            </svg>
        </div>

        <h1>Разработка и тестирование</h1>
        <p>Этот раздел оптимизируется нашей командой. Мы работаем над внедрением новых функций.</p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="progress-text">ВЫПОЛНЕНО: 45%</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
