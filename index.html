<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Announcer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #151e27);
      --card-bg: var(--tg-theme-secondary-bg-color, #1f2c3a);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #7f91a4);
      --button-color: var(--tg-theme-button-color, #5288c1);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      margin-bottom: 10px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #2b394a;
    }

    .badge {
      position: absolute;
      top: 0;
      right: -8px;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
    }

    .badge.online { background-color: #e53935; }
    .badge.offline { background-color: #546e7a; }

    .channel-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .info-text {
      font-size: 12px;
      color: var(--hint-color);
      margin-bottom: 4px;
    }

    .uptime {
      font-size: 11px;
      color: #4caf50;
      font-weight: 600;
      margin-bottom: 12px;
      min-height: 15px;
    }

    .btn-link {
      margin-top: auto;
      width: 100%;
      padding: 8px 0;
      background-color: var(--button-color);
      color: var(--button-text);
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      box-sizing: border-box;
    }

    .empty-state {
      text-align: center;
      color: var(--hint-color);
      grid-column: 1 / -1;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h1>Отслеживаемые каналы</h1>
  <div class="grid" id="channels-container">
    <div class="empty-state">Загрузка каналов...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function renderChannels(channels) {
      const container = document.getElementById("channels-container");
      container.innerHTML = "";

      if (!channels || channels.length === 0) {
        container.innerHTML = '<div class="empty-state">Список отслеживаемых каналов пуст.<br>Добавьте каналы через команду /add</div>';
        return;
      }

      channels.forEach(ch => {
        const card = document.createElement("div");
        card.className = "card";

        const badgeClass = ch.is_online ? "online" : "offline";
        const badgeText = ch.is_online ? "LIVE" : "OFF";
        const uptimeText = ch.is_online && ch.uptime ? `⏱ ${ch.uptime}` : "";
        const avatarUrl = ch.avatar && ch.avatar !== "" ? ch.avatar : "https://static-cdn.jtvnw.net/user-default-pictures-uv/75305b54-c807-477c-92b6-5c746260a0f1-profile_image-70x70.png";

        card.innerHTML = `
          <div class="avatar-wrapper">
            <img class="avatar" src="${avatarUrl}" alt="${ch.name}" onerror="this.src='https://static-cdn.jtvnw.net/user-default-pictures-uv/75305b54-c807-477c-92b6-5c746260a0f1-profile_image-70x70.png'">
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="channel-name">${ch.name}</div>
          <div class="info-text">👥 ${ch.followers} фолловеров</div>
          <div class="uptime">${uptimeText}</div>
          <a class="btn-link" href="https://twitch.tv/${ch.name}" target="_blank">Перейти на канал</a>
        `;

        container.appendChild(card);
      });
    }

    // Получаем данные, переданные из Telegram
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data');

    if (rawData) {
      try {
        const channelsData = JSON.parse(decodeURIComponent(rawData));
        renderChannels(channelsData);
      } catch (e) {
        console.error("Ошибка парсинга данных:", e);
        renderChannels([]);
      }
    } else {
      renderChannels([]);
    }
  </script>
</body>
</html>
